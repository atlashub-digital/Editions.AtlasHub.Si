name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:content
      - name: Validate EA-000 with EPUBCheck 5.4.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          printf '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  %s\n' "$RUNNER_TEMP/epubcheck.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          epubcheck_jar="$(find "$RUNNER_TEMP/epubcheck" -name epubcheck.jar -print -quit)"
          test -n "$epubcheck_jar"
          java -jar "$epubcheck_jar" public/downloads/premium/EA-000_Empresa-Aumentada.epub -j "$RUNNER_TEMP/ea000-epubcheck.json"
      - run: npm run build
