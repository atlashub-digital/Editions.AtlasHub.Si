name: EA-000 Reader visual QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser QA desktop and mobile
        shell: bash
        run: |
          npm run start > "$RUNNER_TEMP/ea000-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/livros/empresa-aumentada/ler > /dev/null; then break; fi
            sleep 1
          done
          node scripts/ea000-visual-browser-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EA-000_Reader_QA_desktop_mobile
          path: editorial/ea000/visual/qa/browser-ci
          retention-days: 30
