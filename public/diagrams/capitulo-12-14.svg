<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 566" role="img" aria-labelledby="title desc"><title id="title">Mapa operacional do supermercado</title><desc id="desc">Cenário didático. Os fluxos regulares são coordenados; divergências e decisões sensíveis retornam ao responsável humano. O arranjo mostra camadas e funções; não atribui autoridade de agentes sobre pessoas.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#456373" stroke-width="1.4"/></marker></defs><g><rect x="42" y="24" width="636" height="70" rx="5" fill="#0b2537" stroke="#0b2537"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff"><tspan x="360" y="65">Proprietário e direção</tspan></text></g><g><rect x="42" y="136" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="177">Coordenação da loja</tspan></text></g><g><rect x="42" y="248" width="198.66666666666666" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="141.33333333333331" y="289">Estoque e compras</tspan></text></g><g><rect x="260.66666666666663" y="248" width="198.66666666666666" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="359.99999999999994" y="277">Promoção e</tspan><tspan x="359.99999999999994" y="301">atendimento</tspan></text></g><g><rect x="479.3333333333333" y="248" width="198.66666666666666" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="578.6666666666666" y="277">Conciliação</tspan><tspan x="578.6666666666666" y="301">financeira</tspan></text></g><g><rect x="42" y="360" widt