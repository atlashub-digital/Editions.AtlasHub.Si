<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="title desc"><title id="title">Hipótese de geração de valor no follow-up</title><desc id="desc">Cadeia causal proposta para teste. Cada ligação exige medição; mais mensagens não demonstram, por si, aumento de receita.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#456373" stroke-width="1.4"/></marker></defs><path d="M360,94 L360,115 L360,115 L360,132" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M360,206 L360,227 L360,227 L360,244" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M360,318 L360,339 L360,339 L360,356" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><g><rect x="42" y="24" width="636" height="70" rx="5" fill="#0b2537" stroke="#0b2537"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff"><tspan x="360" y="65">Agente amplia cobertura de follow-up</tspan></text></g><g><rect x="42" y="136" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="177">Hipótese: mais respostas e reuniões</tspan></text></g><g><rect x="42" y="248" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="289">Hipótese: conversão incremental</tspan></text></g><g><rect x="42" y="360" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="401">Receita e margem atribuíveis</tspan></text></g></svg>