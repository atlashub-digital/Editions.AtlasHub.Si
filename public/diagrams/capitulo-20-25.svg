<svg id="diagram24" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 500px;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#diagram24{font-family:Arial;font-size:16px;fill:#14202e;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram24 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram24 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram24 .error-icon{fill:hsl(32.7272727273, 100%, 100%);}#diagram24 .error-text{fill:#000000;stroke:#000000;}#diagram24 .edge-thickness-normal{stroke-width:1px;}#diagram24 .edge-thickness-thick{stroke-width:3.5px;}#diagram24 .edge-pattern-solid{stroke-dasharray:0;}#diagram24 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram24 .edge-pattern-dashed{stroke-dasharray:3;}#diagram24 .edge-pattern-dotted{stroke-dasharray:2;}#diagram24 .marker{fill:#315677;stroke:#315677;}#diagram24 .marker.cross{stroke:#315677;}#diagram24 svg{font-family:Arial;font-size:16px;}#diagram24 p{margin:0;}#diagram24 .node .neo-node{stroke:#147dff;}#diagram24 [data-look="neo"].node rect,#diagram24 [data-look="neo"].cluster rect,#diagram24 [data-look="neo"].node polygon{stroke:url(#diagram24-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram24 [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram24 [data-look="neo"].node path{stroke:url(#diagram24-gradient);stroke-width:1px;}#diagram24 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram24 [data-look="neo"].node .neo-line path{stroke:#147dff;filter:none;}#diagram24 [data-look="neo"].node circle{stroke:url(#diagram24-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram24 [data-look="neo"].node circle .state-start{fill:#000000;}#diagram24 [data-look="neo"].icon-shape .icon{fill:url(#diagram24-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram24 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#diagram24-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram24 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="71" width="232" height="212" fill="#e9f3ff"></rect><text x="0" y="0" fill="#14202e" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(379, 177) rotate(0)">Automação com guardrails</text></g><g class="quadrant"><rect x="31" y="71" width="232" height="212" fill="#eef8ff"></rect><text x="0" y="0" fill="#0f1b29" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(147, 177) rotate(0)">Humano / decisão aumentada</text></g><g class="quadrant"><rect x="31" y="283" width="232" height="212" fill="#f3fdff"></rect><text x="0" y="0" fill="#0a1624" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(147, 389) rotate(0)">Avaliar caso a caso</text></g><g class="quadrant"><rect x="263" y="283" width="232" height="212" fill="#f8ffff"></rect><text x="0" y="0" fill="#05111f" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(379, 389) rotate(0)">Automação preferencial</text></g></g><g class="border"><line x1="30" y1="71" x2="496" y2="71" style="stroke: rgb(20, 125, 255); stroke-width: 2;"></line><line x1="495" y1="72" x2="495" y2="494" style="stroke: rgb(20, 125, 255); stroke-width: 2;"></line><line x1="30" y1="495" x2="496" y2="495" style="stroke: rgb(20, 125, 255); stroke-width: 2;"></line><line x1="31" y1="72" x2="31" y2="494" style="stroke: rgb(20, 125, 255); stroke-width: 2;"></line><line x1="263" y1="72" x2="263" y2="494" style="stroke: rgb(20, 125, 255); stroke-width: 1;"></line><line x1="32" y1="283" x2="494" y2="283" style="stroke: rgb(20, 125, 255); stroke-width: 1;"></line></g><g class="data-points"></g><g class="labels"><g class="label"><text x="0" y="0" fill="#14202e" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 45) rotate(0)">Difícil reverter</text></g><g class="label"><text x="0" y="0" fill="#14202e" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 45) rotate(0)">Fácil reverter</text></g><g class="label"><text x="0" y="0" fill="#14202e" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 389) rotate(-90)">Baixo impacto</text></g><g class="label"><text x="0" y="0" fill="#14202e" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 177) rotate(-90)">Alto impacto</text></g></g><g class="title"><text x="0" y="0" fill="#14202e" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Impacto do erro × Reversibilidade</text></g></g></svg>