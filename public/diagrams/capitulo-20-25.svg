<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="title desc"><title id="title">Impacto do erro e reversibilidade</title><desc id="desc">A reversibilidade não elimina o risco. Alto impacto exige supervisão proporcional; casos de baixo impacto e alta reversibilidade tendem a ser candidatos melhores à automação.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#456373" stroke-width="1.4"/></marker></defs><g><rect x="42" y="24" width="308" height="70" rx="5" fill="#0b2537" stroke="#0b2537"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff"><tspan x="196" y="65">Alto impacto · difícil reverter</tspan></text></g><g><rect x="370" y="24" width="308" height="70" rx="5" fill="#0b2537" stroke="#0b2537"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff"><tspan x="524" y="65">Alto impacto · fácil reverter</tspan></text></g><g><rect x="42" y="136" width="308" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="196" y="177">Baixo impacto · difícil reverter</tspan></text></g><g><rect x="370" y="136" width="308" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="524" y="177">Baixo impacto · fácil reverter</tspan></text></g></svg>