<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="title desc"><title id="title">Quatro modos de decisão</title><desc id="desc">Modos escolhidos conforme contexto, risco e valor do julgamento humano. Não constituem degraus obrigatórios de maturidade.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#456373" stroke-width="1.4"/></marker></defs><g><rect x="42" y="24" width="636" height="70" rx="5" fill="#0b2537" stroke="#0b2537"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff"><tspan x="360" y="65">A Execução automática</tspan></text></g><g><rect x="42" y="136" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="177">B Execução supervisionada</tspan></text></g><g><rect x="42" y="248" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="289">C Decisão aumentada</tspan></text></g><g><rect x="42" y="360" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="401">D Liderança humana</tspan></text></g></svg>