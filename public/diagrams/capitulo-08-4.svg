<svg id="diagram3" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 744px;" viewBox="4 4 744 112" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#diagram3{font-family:Arial;font-size:16px;fill:#14202e;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram3 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram3 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram3 .error-icon{fill:hsl(32.7272727273, 100%, 100%);}#diagram3 .error-text{fill:#000000;stroke:#000000;}#diagram3 .edge-thickness-normal{stroke-width:1px;}#diagram3 .edge-thickness-thick{stroke-width:3.5px;}#diagram3 .edge-pattern-solid{stroke-dasharray:0;}#diagram3 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram3 .edge-pattern-dashed{stroke-dasharray:3;}#diagram3 .edge-pattern-dotted{stroke-dasharray:2;}#diagram3 .marker{fill:#315677;stroke:#315677;}#diagram3 .marker.cross{stroke:#315677;}#diagram3 svg{font-family:Arial;font-size:16px;}#diagram3 p{margin:0;}#diagram3 .label{font-family:Arial;color:#14202e;}#diagram3 .cluster-label text{fill:#000000;}#diagram3 .cluster-label span{color:#000000;}#diagram3 .cluster-label span p{background-color:transparent;}#diagram3 .label text,#diagram3 span{fill:#14202e;color:#14202e;}#diagram3 .node rect,#diagram3 .node circle,#diagram3 .node ellipse,#diagram3 .node polygon,#diagram3 .node path{fill:#e9f3ff;stroke:#147dff;stroke-width:1px;}#diagram3 .rough-node .label text,#diagram3 .node .label text,#diagram3 .image-shape .label,#diagram3 .icon-shape .label{text-anchor:middle;}#diagram3 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram3 .rough-node .label,#diagram3 .node .label,#diagram3 .image-shape .label,#diagram3 .icon-shape .label{text-align:center;}#diagram3 .node.clickable{cursor:pointer;}#diagram3 .root .anchor path{fill:#315677!important;stroke-width:0;stroke:#315677;}#diagram3 .arrowheadPath{fill:#0b0b0b;}#diagram3 .edgePaths .path{stroke:#315677;stroke-width:1px;}#diagram3 .flowchart-link{stroke:#315677;fill:none;}#diagram3 .edgeLabel{background-color:hsl(92.7272727273, 100%, 95.6862745098%);text-align:center;}#diagram3 .edgeLabel p{background-color:hsl(92.7272727273, 100%, 95.6862745098%);}#diagram3 .edgeLabel rect{opacity:0.5;background-color:hsl(92.7272727273, 100%, 95.6862745098%);fill:hsl(92.7272727273, 100%, 95.6862745098%);}#diagram3 .labelBkg{background-color:rgba(243, 255, 233, 0.5);}#diagram3 .cluster rect{fill:hsl(32.7272727273, 100%, 100%);stroke:hsl(32.7272727273, 60%, 90%);stroke-width:1px;}#diagram3 .cluster text{fill:#000000;}#diagram3 .cluster span{color:#000000;}#diagram3 .node .collapsed-indicator{fill:hsl(32.7272727273, 60%, 90%);stroke:none;opacity:0.6;}#diagram3 .node .collapsed-separator{stroke:hsl(32.7272727273, 60%, 90%);stroke-width:0.75px;}#diagram3 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial;font-size:12px;background:hsl(32.7272727273, 100%, 100%);border:1px solid hsl(32.7272727273, 60%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#diagram3 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#14202e;}#diagram3 rect.text{fill:none;stroke-width:0;}#diagram3 .icon-shape,#diagram3 .image-shape{background-color:hsl(92.7272727273, 100%, 95.6862745098%);text-align:center;}#diagram3 .icon-shape p,#diagram3 .image-shape p{background-color:hsl(92.7272727273, 100%, 95.6862745098%);padding:2px;}#diagram3 .icon-shape .label rect,#diagram3 .image-shape .label rect{opacity:0.5;background-color:hsl(92.7272727273, 100%, 95.6862745098%);fill:hsl(92.7272727273, 100%, 95.6862745098%);}#diagram3 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram3 .node .label-icon path{fill:currentCo