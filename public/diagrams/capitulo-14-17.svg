e="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="177">Coordenação comercial</tspan></text></g><g><rect x="42" y="248" width="198.66666666666666" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="141.33333333333331" y="289">Pesquisa e cultura</tspan></text></g><g><rect x="260.66666666666663" y="248" width="198.66666666666666" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="359.99999999999994" y="289">Logística e finanças</tspan></text></g><g><rect x="479.3333333333333" y="248" width="198.66666666666666" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="578.6666666666666" y="289">Risco e conformidade</tspan></text></g><g><rect x="42" y="360" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="401">Síntese: oportunidade e limites</tspan></text></g><g><rect x="42" y="472" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="513">Decisão humana sobre o piloto</tspan></text></g></svg>