<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 678" role="img" aria-labelledby="title desc"><title id="title">Da mensagem à oportunidade imobiliária</title><desc id="desc">O contexto acompanha a oportunidade ao longo do processo. Negociação, compromissos e verificações profissionais mantêm responsáveis humanos.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#456373" stroke-width="1.4"/></marker></defs><path d="M360,94 L360,115 L360,115 L360,132" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M360,206 L360,227 L360,227 L360,244" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M360,318 L360,339 L196,339 L196,356" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M360,318 L360,339 L524,339 L524,356" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M196,430 L196,451 L360,451 L360,468" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M524,430 L524,451 L360,451 L360,468" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M360,542 L360,563 L360,563 L360,580" fill="none" stroke="#456373" stroke-width="1.6" marker-end="url(#arrow)"/><g><rect x="42" y="24" width="636" height="70" rx="5" fill="#0b2537" stroke="#0b2537"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff"><tspan x="360" y="65">Canais de entrada e registro no CRM</tspan></text></g><g><rect x="42" y="136" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="177">Critérios declarados e busca no inventário</tspan></text></g><g><rect x="42" y="248" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="289">Coordenação comercial</tspan></text></g><g><rect x="42" y="360" width="308" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="196" y="401">Profissional comercial</tspan></text></g><g><rect x="370" y="360" width="308" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="524" y="401">Agenda e follow-up</tspan></text></g><g><rect x="42" y="472" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="513">Visita, negociação e documentação</tspan></text></g><g><rect x="42" y="584" width="636" height="70" rx="5" fill="#f1f5f5" stroke="#adc1c7"/><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#142d3c"><tspan x="360" y="625">Fechamento e pós-venda</tspan></text></g></svg>